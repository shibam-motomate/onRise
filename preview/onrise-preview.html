:root{
  --bg:#F5F2EC;--surface:#fff;--warm:#F0EBE1;--alt2:#EEE9DE;--imgph:#EAE0CD;
  --ink:#332F28;--muted:#6E6252;--subtle:#857766;--forest:#26332B;--forestdeep:#1F2A23;
  --sage:#5E7A63;--sagelight:#6E8A72;--sagesoft:#7E9A82;--sand:#E8DDCA;
  --serif:'Marcellus',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif;
}
/* This preview commits to the OnRise light identity by design (warm cream ground). */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;}
::selection{background:#E4D6BC;color:#2A251F;}
a{color:var(--sage);text-decoration:none;}
a:hover{color:#3A473E;}
img,svg{display:block;}
button{font-family:inherit;cursor:pointer;}
input,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;}

@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastA{0%{opacity:0;transform:translate(-50%,12px)}12%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
@keyframes ov{from{opacity:0}to{opacity:1}}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes sheetIn{from{transform:translateY(-18px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1240px;margin:0 auto;padding:0 40px;}
.eyebrow{color:var(--sage);font-size:12px;letter-spacing:.34em;text-transform:uppercase;}
.disp{font-family:var(--serif);font-weight:400;}
.ph{width:100%;height:100%;background:var(--imgph);}
.fade{animation:fade .5s ease both;}

.btn{cursor:pointer;border:none;font-weight:600;border-radius:4px;font-size:15px;transition:background .18s ease;display:inline-flex;align-items:center;justify-content:center;gap:9px;}
.btn-dark{background:var(--forest);color:#F5F2EB;padding:14px 30px;}
.btn-dark:hover{background:#3E4E44;}
.btn-cream{background:#F5F2EB;color:var(--ink);padding:14px 30px;}
.btn-cream:hover{background:#ECE4D5;}
.btn-sm{padding:12px 22px;font-size:14px;font-weight:500;}

/* header */
header{position:sticky;top:0;z-index:100;background:rgba(30,42,33,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(126,154,130,.28);}
.hbar{display:flex;align-items:center;justify-content:space-between;padding:17px 40px;max-width:1240px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer;}
.logo span{font-family:var(--serif);font-size:22px;letter-spacing:.34em;color:#F2EFE6;}
nav.main{display:flex;align-items:center;gap:36px;font-size:14px;letter-spacing:.05em;}
nav.main span{cursor:pointer;color:#C4B79D;transition:color .15s;}
nav.main span:hover{color:#7E9A82;}
nav.main span.active{color:#F2EFE6;}
nav.main span.sale{color:#E0A45A;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;}
.hicons{display:flex;align-items:center;gap:22px;}
.hicons .ic{cursor:pointer;display:flex;transition:opacity .15s;}
.hicons .ic:hover{opacity:.7;}
.cartbtn{position:relative;}
.cartbtn .badge{position:absolute;top:-8px;right:-11px;background:#7E9A82;color:#F5F2EB;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.burger{display:none;width:40px;height:40px;align-items:center;justify-content:center;border-radius:10px;border:1px solid rgba(242,239,230,.25);cursor:pointer;}

/* generic section title */
.sec{padding:0 40px 100px;}
h2.disp{font-size:40px;line-height:1.12;margin:0;}

/* product grid */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:30px 26px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;}
.pcard .well{position:relative;background:var(--warm);border-radius:10px;overflow:hidden;aspect-ratio:1/1;margin-bottom:14px;cursor:pointer;transition:box-shadow .18s;}
.pcard .well:hover{box-shadow:0 16px 38px rgba(24,32,26,.12);}
.pcard .addbar{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(24,32,26,.92);color:#F5F2EB;text-align:center;padding:11px;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .18s;}
.pcard .addbar:hover{background:#3E4E44;}
.pcat{font-size:12.5px;color:var(--sagelight);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;}
.pname{font-size:15.5px;font-weight:500;color:var(--ink);margin-bottom:4px;cursor:pointer;}
.pname:hover{color:var(--sage);}
.pprice{font-size:15px;color:#5E5646;font-weight:600;}

.chip{cursor:pointer;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid #E2D7C4;background:#fff;color:#5E5646;}
.chip.active{background:var(--ink);color:#F5F2EB;border-color:var(--ink);}

/* card */
.card{background:#fff;border:1px solid var(--sand);border-radius:12px;overflow:hidden;transition:box-shadow .18s,transform .18s;}
.card.lift:hover{box-shadow:0 18px 44px rgba(24,32,26,.10);transform:translateY(-3px);}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(20,28,22,.42);animation:ov .25s ease both;}
.drawer{position:fixed;inset:0;z-index:300;}
.drawer aside{position:absolute;top:0;right:0;height:100%;width:420px;max-width:92vw;background:var(--bg);box-shadow:-20px 0 60px rgba(24,32,26,.25);display:flex;flex-direction:column;animation:drawerIn .3s cubic-bezier(.22,.61,.36,1) both;}
.toast{position:fixed;z-index:400;left:50%;bottom:34px;background:var(--forest);color:#F5F2EB;padding:13px 22px;border-radius:999px;font-size:14.5px;box-shadow:0 14px 40px rgba(24,32,26,.28);display:flex;align-items:center;gap:10px;animation:toastA 2.2s ease forwards;}
.toast .dot{width:8px;height:8px;border-radius:50%;background:#D8C49A;}

.qstep{display:flex;align-items:center;border:1px solid #E2D7C4;border-radius:8px;overflow:hidden;}
.qstep div{width:46px;height:50px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#5E5646;cursor:pointer;}
.qstep div:hover{background:var(--alt2);}
.qstep .val{width:52px;font-size:16px;font-weight:600;cursor:default;}

/* footer */
footer{background:#1E2A22;color:#D0C6B2;}
.fcol h4{font-size:15px;color:#F5F2EB;margin:0 0 16px;font-weight:600;}
.fcol .fl{display:flex;flex-direction:column;gap:11px;font-size:14px;}
.fcol .fl span{cursor:pointer;}
.fcol .fl span:hover{color:#F5F2EB;}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.6fr;gap:40px;}

input.fld,textarea.fld{padding:14px 15px;border:1px solid #E2D7C4;border-radius:8px;font-size:14.5px;color:var(--ink);background:#fff;outline:none;width:100%;}
input.fld:focus,textarea.fld:focus{border-color:var(--sage);}

/* mobile tab bar */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:240;background:rgba(38,51,43,.97);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);padding:8px 4px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:3px 0;color:#8FA593;font-size:10.5px;font-weight:600;cursor:pointer;}
.tabbar a.active{color:#EAF0E6;}

.two{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;}
.split{display:grid;grid-template-columns:300px 1fr;gap:56px;align-items:start;}

@media(max-width:760px){
  nav.main{display:none;}
  .burger{display:flex;}
  .tabbar{display:flex;}
  #app{padding-bottom:66px;}
  .wrap,.hbar,.sec{padding-left:18px;padding-right:18px;}
  .grid4{grid-template-columns:1fr 1fr;}
  .grid3{grid-template-columns:1fr;}
  .two,.split,.foot-grid{grid-template-columns:1fr;gap:32px;}
  .hero-h{font-size:40px!important;}
  h2.disp{font-size:27px;line-height:1.16;}
  .drawer aside{width:100%;}
}
</style>

<div id="app"></div>
<div id="overlays"></div>

  var body;
  if(S.cart.length){
    var lines=S.cart.map(function(it){return '<div style="display:flex;gap:14px;padding:18px 0;border-bottom:1px solid #EAE0CE"><div style="width:76px;height:76px;border-radius:8px;overflow:hidden;background:var(--warm);flex-shrink:0">'+ph(it.name)+'</div><div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:600;margin-bottom:3px">'+esc(it.name)+'</div><div style="font-size:13.5px;color:var(--subtle);margin-bottom:11px">'+it.price+'</div><div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;border:1px solid #E2D7C4;border-radius:6px;overflow:hidden"><div onclick="setQty(\''+esc(it.name)+'\','+(it.qty-1)+')" style="cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#5E5646">−</div><div style="width:34px;text-align:center;font-size:14px;font-weight:600">'+it.qty+'</div><div onclick="setQty(\''+esc(it.name)+'\','+(it.qty+1)+')" style="cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#5E5646">+</div></div><span style="font-size:14.5px;font-weight:600">'+money(parseP(it.price)*it.qty)+'</span></div></div><div onclick="removeItem(\''+esc(it.name)+'\')" style="cursor:pointer;color:#B8AC98;font-size:19px;line-height:1;align-self:flex-start">×</div></div>';}).join('');
    body='<div style="flex:1;overflow-y:auto;padding:4px 24px">'+lines+'</div><div style="padding:20px 24px 26px;border-top:1px solid var(--sand);background:var(--alt2)"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><span style="font-size:15px;color:#5E5646">Subtotal</span><span class="disp" style="font-size:24px">'+money(subtotal())+'</span></div><p style="font-size:12.5px;color:var(--subtle);margin:0 0 16px">Taxes and shipping calculated at checkout.</p><button class="btn btn-dark" style="width:100%;border-radius:8px" onclick="closeCart();alert(\'Checkout is available in the full Next.js build.\')">Checkout</button><div onclick="closeCart()" style="cursor:pointer;text-align:center;padding:12px;font-size:14px;color:var(--sage);font-weight:500">Continue shopping</div></div>';
  } else {
    body='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" style="margin-bottom:18px"><path d="M6 8 H18 L17 20 H7 Z" stroke="#C8BA9F" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 8 V6.5 A3 3 0 0 1 15 6.5 V8" stroke="#C8BA9F" stroke-width="1.4"/></svg><div class="disp" style="font-size:22px;margin-bottom:8px">Your cart is empty</div><p style="font-size:14.5px;color:var(--subtle);margin:0 0 24px;max-width:240px;line-height:1.6">Add a little of the hills to your home — start with our latest arrivals.</p><button class="btn btn-dark" style="border-radius:8px" onclick="closeCart();go(\'shop\',{cat:\'All\'})">Browse the Shop</button></div>';
  }
  return '<div class="drawer"><div class="scrim" onclick="closeCart()"></div><aside><div style="display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--sand)"><div class="disp" style="font-size:22px">Your Cart <span style="font-size:15px;color:var(--subtle);font-family:var(--sans)">('+cartCount()+')</span></div><div onclick="closeCart()" style="cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#5E5646">×</div></div>'+body+'</aside></div>';
}

function searchOverlay(){
  if(!S.searchOpen)return '';
  return '<div style="position:fixed;inset:0;z-index:310"><div class="scrim" onclick="closeSearch()"></div><div style="position:absolute;top:0;left:0;right:0;background:var(--bg);box-shadow:0 24px 60px rgba(24,32,26,.22);animation:sheetIn .28s ease both;max-height:88vh;overflow-y:auto"><div class="wrap" style="max-width:1000px;padding-top:30px;padding-bottom:40px"><div style="display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#332F28" stroke-width="1.7"/><path d="M16.5 16.5L21 21" stroke="#332F28" stroke-width="1.7" stroke-linecap="round"/></svg><input id="searchInput" oninput="onSearch(this.value)" placeholder="Search for sofas, lighting, storage…" style="flex:1;border:none;background:transparent;font-family:var(--serif);font-size:26px;color:var(--ink);outline:none"><div onclick="closeSearch()" style="cursor:pointer;font-size:14px;color:var(--subtle)">Close ×</div></div><div id="searchResults"></div></div></div></div>';
}
function renderSearchResults(){
  var host=document.getElementById('searchResults');if(!host)return;
  var q=S.query.trim().toLowerCase();
  if(!q){host.innerHTML='<div style="padding:30px 0 14px"><div style="font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--sagelight);margin-bottom:16px">Popular categories</div><div style="display:flex;flex-wrap:wrap;gap:10px">'+['Living Room','Bedroom','Dining & Kitchen','Lighting & Decor','Storage'].map(function(c){return '<div class="chip" onclick="document.getElementById(\'searchInput\').value=\''+esc(c)+'\';onSearch(\''+esc(c)+'\')">'+esc(c)+'</div>';}).join('')+'</div></div>';return;}
  var res=PRODUCTS.filter(function(p){return p.name.toLowerCase().indexOf(q)>=0||p.category.toLowerCase().indexOf(q)>=0;});
  if(!res.length){host.innerHTML='<div style="padding:50px 0;text-align:center"><div class="disp" style="font-size:24px;margin-bottom:8px">No pieces found</div><p style="font-size:14.5px;color:var(--subtle);margin:0">Try a room name like “Bedroom”, or browse the full shop.</p></div>';return;}
  host.innerHTML='<div style="padding:22px 0 6px;font-size:13.5px;color:var(--subtle)">'+res.length+' results</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+res.map(function(r){return '<div onclick="closeSearch();openProduct(\''+esc(r.name)+'\')" style="cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px;border-radius:10px" onmouseover="this.style.background=\'#EEE9DE\'" onmouseout="this.style.background=\'transparent\'"><div style="width:62px;height:62px;border-radius:8px;overflow:hidden;background:var(--warm);flex-shrink:0">'+ph(r.name)+'</div><div style="flex:1;min-width:0"><div style="font-size:12px;color:var(--sagelight);letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px">'+esc(r.category)+'</div><div style="font-size:15px;font-weight:500">'+esc(r.name)+'</div></div><span style="font-size:14.5px;font-weight:600;color:#5E5646">'+r.price+'</span></div>';}).join('')+'</div>';
}
function mobileNav(){
  if(!S.mobileNav)return '';
  var links=[['home','Home'],['about','About'],['shop','Shop'],['contact','Contact'],['sale','Sale']].map(function(l){return '<div onclick="go(\''+l[0]+'\''+(l[0]==='shop'?',{cat:\'All\'}':'')+')" style="cursor:pointer;padding:15px 12px;border-radius:10px;font-size:16px;color:#EAF0E6;border-bottom:1px solid rgba(255,255,255,.07)">'+l[1]+'</div>';}).join('');
  return '<div style="position:fixed;inset:0;z-index:250"><div class="scrim" style="background:rgba(20,28,22,.5)" onclick="closeNav()"></div><div style="position:absolute;top:0;left:0;bottom:0;width:284px;max-width:82vw;background:#26332B;box-shadow:20px 0 60px rgba(20,28,22,.45);padding:24px 22px;display:flex;flex-direction:column;gap:2px;animation:ov .25s ease both"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px"><span class="disp" style="font-size:20px;letter-spacing:.3em;color:#F2EFE6">ONRISE</span><div onclick="closeNav()" style="cursor:pointer;color:#B7C4B2;font-size:26px;width:34px;height:34px;display:flex;align-items:center;justify-content:center">×</div></div>'+links+'</div></div>';
}

/* ---------- render ---------- */
function renderChrome(){document.getElementById('appHeader').innerHTML=header();}
function renderOverlays(){document.getElementById('overlays').innerHTML=mobileNav()+cartDrawer()+searchOverlay();if(S.searchOpen)renderSearchResults();}
function render(){
  var main;
  switch(S.view){case 'shop':main=viewShop();break;case 'product':main=viewProduct();break;case 'sale':main=viewSale();break;case 'about':main=viewAbout();break;case 'contact':main=viewContact();break;default:main=viewHome();}
  document.getElementById('app').innerHTML='<div id="appHeader">'+header()+'</div>'+main+footer()+tabbar()+'<div id="toastHost"></div>';
  renderOverlays();
}
// live sale countdown — update only the timer, not the whole page
setInterval(function(){var el=document.getElementById('saleCd');if(el)el.innerHTML=countdownHtml();},1000);
render();
</script>
